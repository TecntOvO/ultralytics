# Ultralytics YOLO 🚀, AGPL-3.0 license
# YOLO11 object detection model with P3-P5 outputs. For Usage examples see https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolo11n.yaml' will call yolo11.yaml with scale 'n'


# YOLO11n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, MConv2d, [32, 3, 2]] # 0-P1/2

  - [-1, 1, MConv2d, [32, 3, 2]] # 1-P2/4
  - [-1, 1, MConv2d, [32, 1, 1]]

  - [-1, 1, MConv2d, [96, 3, 2]] # 3-P3/8
  - [-1, 1, MConv2d, [64, 1, 1]]

  - [-1, 1, UIB, [96, 5, 5, True, 2, 2]]  # 5-P4/16
  - [-1, 1, UIB, [96, 0, 3, True, 1, 2]]
  - [-1, 1, UIB, [96, 0, 3, True, 1, 2]]
  - [-1, 1, UIB, [96, 0, 3, True, 1, 2]]
  - [-1, 1, UIB, [96, 0, 3, True, 1, 2]]
  - [-1, 1, UIB, [96, 3, 0, True, 1, 4]]  # 10

  - [-1, 1, UIB, [128, 3, 3, True, 2, 6]]  # 11-P5/32
  - [-1, 1, UIB, [128, 5, 5, True, 1, 4]]
  - [-1, 1, UIB, [128, 0, 5, True, 1, 4]]
  - [-1, 1, UIB, [128, 0, 5, True, 1, 3]]
  - [-1, 1, UIB, [128, 0, 3, True, 1, 4]]
  - [-1, 1, UIB, [128, 0, 3, True, 1, 4]]  # 16

  - [-1, 1, SPPF, [128, 5]]
  - [-1, 1, C2PSA, [128]] # 18

# YOLO11n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 10], 1, Concat, [1]] # cat backbone P4
  - [-1, 1, C3k2, [96, False]] # 21

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 1, C3k2, [64, False]] # 24 (P3/8-small)

  - [-1, 1, Conv, [64, 3, 2]]
  - [[-1, 21], 1, Concat, [1]] # cat head P4
  - [-1, 1, C3k2, [96, False]] # 27 (P4/16-medium)

  - [-1, 1, Conv, [96, 3, 2]]
  - [[-1, 18], 1, Concat, [1]] # cat head P5
  - [-1, 1, C3k2, [128, True]] # 30 (P5/32-large)

  - [[24, 27, 30], 1, Detect, [nc]] # Detect(P3, P4, P5)
