#yolov11-MobileViT-xxs.yaml

# Parameters
nc: 80  # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov8n.yaml' will call yolov8.yaml with scale 'n'
depth_multiple: 0.5  # model depth multiple
width_multiple: 1.0  # layer channel multiple 0.25
# Summary 422 layers, 1,491,541 parameters(974,873 parameters in backbone), 1,491,525 gradients, 7.2 GFLOPs

backbone:
  # [from, repeats, module, args]
  # [from, repeats, Conv, [c2, kernel_size, stride]]
  # [from, repeats, MV2Block, [c2, stride, expandsion]]
  # [from, repeats, MobileViTBlockv2, [embed_dim, depth, hid_dim, patch_size, kernel_size, dropout]]
  - [-1, 1, Conv, [16, 3, 2]]  # 0-P1/2
  - [-1, 1, MV2Block, [24, 1, 2]]  # 1
  - [-1, 1, MV2Block, [48, 2, 2]]  # 2-P2/4
  - [-1, 1, MV2Block, [48, 1, 2]]  # 3
  - [-1, 1, MV2Block, [64, 2, 2]]  # 4-P3/8
  - [-1, 1, MobileViTBlockv2, [72, 2, 144, 2, 3, 0, 0.0]]
  - [-1, 1, MV2Block, [72, 2, 2]]  # 6-P4/16
  - [-1, 1, MobileViTBlockv2, [96, 4, 192, 2 ,3, 0, 0.0]]
  - [-1, 1, MV2Block, [96, 2, 2]]  # 8-P5/16
  - [-1, 1, MobileViTBlockv2, [128, 3, 256, 1 ,3, 0, 0.0]]

head:
  # [from, repeats, module, args]
  # [from, repeats, MultiSEAM, [c2, depth, kernel_size, patch_size, reduction]]

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 7], 1, Concat, [1]]  # cat backbone P4
  - [-1, 2, C3k2, [72, False]]  # 12

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 5], 1, Concat, [1]]  # cat backbone P3
  - [-1, 2, C3k2, [64, False]]  # 15 (P3/8-small)

  - [-1, 1, Conv, [64, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]
  - [-1, 2, C3k2, [72, False]] # 18 (P4/16-medium)

  - [-1, 1, Conv, [72, 3, 2]]
  - [[-1, 9], 1, Concat, [1]]  # cat head P4
  - [-1, 2, C3k2, [96, True]]  # 21 (P5/32-large)

  - [15, 1, SEAM, [1, 16]] # 22
  - [18, 1, SEAM, [1, 16]] # 23
  - [21, 1, SEAM, [1, 16]] # 24

  - [[22, 23, 24], 1, Detect, [nc]]  # Detect(P3, P4, P5)