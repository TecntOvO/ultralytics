# Ultralytics YOLO 🚀, AGPL-3.0 license
# YOLO11 object detection model with P3-P5 outputs. For Usage examples see https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolo11n.yaml' will call yolo11.yaml with scale 'n'
depth_multiple: 1.0  # model depth multiple
width_multiple: 1.0  # layer channel multiple 0.25

# YOLO11n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [16, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [32, 3, 2]] # 1-P2/4
  - [-1, 1, C3k2, [64, False, 0.25]]
  - [-1, 1, Conv, [64, 3, 2]] # 3-P3/8
  - [-1, 1, MobileViTBlockv2, [32, 2, 64, 2, 3, 0, 0.0, 0.0, 0]]
  - [-1, 1, Conv, [80, 3, 2]] # 5-P4/16
  - [-1, 1, MobileViTBlockv2, [40, 4, 80, 2, 3, 0, 0.0, 0.0, 0]]
  - [-1, 1, Conv, [128, 3, 2]] # 7-P5/32
  - [-1, 1, C3k2, [128, True]]
  - [-1, 1, SPPF, [128, 5]] # 9
  - [-1, 1, MobileViTBlockv2, [64, 3, 128, 1, 3, 0, 0.0, 0.0, 0]]


# YOLO11n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 1, C3k2, [80, False]] # 13 11

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 1, C3k2, [64, False]] # 16 (P3/8-small) 14

  - [-1, 1, Conv, [64, 3, 2]]
  - [[-1, 13], 1, Concat, [1]] # cat head P4
  - [-1, 1, C3k2, [80, False]] # 19 (P4/16-medium) 17 22

  - [-1, 1, Conv, [80, 3, 2]]
  - [[-1, 10], 1, Concat, [1]] # cat head P5
  - [-1, 1, C3k2, [128, True]] # 22 (P5/32-large) 20 25

  - [[16, 19, 22], 1, Detect, [nc]] # Detect(P3, P4, P5)
