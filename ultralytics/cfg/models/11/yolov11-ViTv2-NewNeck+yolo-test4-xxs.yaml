#yolov11-MobileViT-xxs.yaml

# Parameters
nc: 80  # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov8n.yaml' will call yolov8.yaml with scale 'n'
depth_multiple: 1.0  # model depth multiple
width_multiple: 1.0  # layer channel multiple 0.25
# Summary 389 layers, 1,104,686 parameters(487,401 parameters in backbone), 1,104,670 gradients, 4.8 GFLOPs

backbone:
  # [from, repeats, module, args]
  # [from, repeats, Conv, [c2, kernel_size, stride]]
  # [from, repeats, MV2Block, [c2, stride, expandsion]]
  # [from, repeats, MobileViTBlockv2, [embed_dim, depth, hid_dim, patch_size, kernel_size, attn_drop, ff_dropout, dropout, layer_dropout]]
  - [-1, 1, Conv, [16, 3, 2]]  # 0-P1/2
  - [-1, 1, MV2Block, [16, 1, 2]]  # 1
  - [-1, 1, MV2Block, [24, 2, 2]]  # 2-P2/4
#  - [-1, 1, C3k2, [24, False, 0.25]]
  - [-1, 1, MobileViTBlockv2, [16, 1, 32, 2, 3, 0, 0.0, 0.0, 0]]
  - [-1, 1, MV2Block, [64, 2, 2]]  # 4-P3/8
  - [-1, 1, MobileViTBlockv2, [32, 2, 64, 2, 3, 0, 0.0, 0.0, 0]]
  - [-1, 1, MV2Block, [80, 2, 2]]  # 6-P4/16
  - [-1, 1, MobileViTBlockv2, [40, 4, 80, 2, 3, 0, 0.0, 0.0, 0]]
  - [-1, 1, MV2Block, [128, 2, 2]]  # 8-P5/16
  - [-1, 1, MobileViTBlockv2, [64, 3, 128, 1, 3, 0, 0.0, 0.0, 0]]
  - [-1, 1, C3k2, [128, True]]
  - [-1, 1, SPPF, [128, 5]] # 10
  - [-1, 1, C2PSA, [128]] # 11
head:
  # [from, repeats, module, args]
  # [from, repeats, MultiSEAM, [c2, depth, kernel_size, patch_size, reduction]]

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 7], 1, Concat, [1]]  # cat backbone P4
  - [-1, 1, C3k2, [80, False]]  # 14 (P4/16-medium)

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 5], 1, Concat, [1]]  # cat backbone P3
  - [-1, 1, C3k2, [64, False]]  # 17 (P3/8-small)

  - [3, 1, Conv, [24, 3, 2]]
  - [[-1, 17], 1, Concat, [1]] # cat backbone P2
  - [-1, 1, C3k2, [64, False]] # 20 (P3/8-small)

  - [-1, 1, Conv, [64, 3, 2]]
  - [[-1, 14], 1, Concat, [1]]
  - [-1, 1, C3k2, [80, False]] # 23 (P4/16-medium)

  - [-1, 1, Conv, [80, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]  # cat head P4
  - [-1, 1, C3k2, [128, True]]  # 26 (P5/32-large)

  - [[20, 23, 26], 1, Detect, [nc]]  # Detect(P3, P4, P5)
#  - [[15, 18, 21], 1, Detect, [nc]]  # Detect(P3, P4, P5)