# Ultralytics YOLO 🚀, AGPL-3.0 license
# YOLO11 object detection model with P3-P5 outputs. For Usage examples see https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolo11n.yaml' will call yolo11.yaml with scale 'n'
depth_multiple: 0.5  # model depth multiple
width_multiple: 1.0  # layer channel multiple 0.25

# YOLO11n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [16, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [32, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [64, False, 0.25]]
  - [-1, 1, Conv, [64, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [128, False, 0.25]]
  - [-1, 1, Conv, [128, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [128, True]]

# YOLO11n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
#  - [-1, 1, CARAFE, []]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2, [64, False]]
#  - [-1, 2, C3k2A, [64, False]]
#  - [-1, 2, VoVGSCSP, [128]]
#  - [-1, 2, C3k2A, [64, True, 2, 2]]

  - [-1, 1, Conv, [64, 3, 2]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [128, False]]
#  - [-1, 2, C3k2A, [128, False]]
#  - [-1, 2, VoVGSCSP, [256]]
#  - [-1, 2, C3k2A, [128, True, 2, 2]]

  - [[9, 12], 1, Detect, [nc]] # Detect(P3, P4, P5)
