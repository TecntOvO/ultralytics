#yolov11-MobileViT-xxs.yaml

# Parameters
nc: 80  # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov8n.yaml' will call yolov8.yaml with scale 'n'
depth_multiple: 0.5  # model depth multiple
width_multiple: 1.0  # layer channel multiple 0.25

backbone:
  # [from, repeats, module, args]
  # [from, repeats, Conv, [c2, kernel_size, stride]]
  # [from, repeats, MV2Block, [c2, stride, expandsion]]
  # [from, repeats, MobileViTBlock, [dim, depth, kernel_size, patch_size, mlp_dim, dropout]]
  # [from, repeats, MobileViTBlockv2, [embed_dim, depth, hid_dim, patch_size, kernel_size, dropout]]
#  - [-1, 1, Conv, [32, 3, 2]]  # 0-P1/2
#  - [-1, 1, MV2Block, [64, 1, 2]]  # 1
#  - [-1, 1, MV2Block, [128, 2, 2]]  # 2
#  - [-1, 1, MV2Block, [128, 1, 2]]  # 3
#  - [-1, 1, MV2Block, [128, 1, 2]]  # 4
#  - [-1, 1, MV2Block, [256, 2, 2]]  # 5
#  - [-1, 1, MobileViTBlockv2, [128, 2, 256, 2, 3, 0]]
#  - [-1, 1, MV2Block, [384, 2, 2]]  # 7
#  - [-1, 1, MobileViTBlockv2, [192, 4, 384, 2 ,3, 0]]
#  - [-1, 1, MV2Block, [512, 2, 2]]  # 9
#  - [-1, 1, MobileViTBlockv2, [256, 3, 512, 2, 3, 0]]
  - [-1, 1, Conv, [16, 3, 2]]  # 0-P1/2
  - [-1, 1, MV2Block, [16, 1, 2]]  # 1
  - [-1, 1, MV2Block, [24, 2, 2]]  # 2-P2/4
  - [-1, 1, MV2Block, [24, 1, 2]]  # 3
  - [-1, 1, MV2Block, [24, 1, 2]]  # 4
  - [-1, 1, MV2Block, [48, 2, 2]]  # 5-P3/8
  - [-1, 1, MobileViTBlockv2, [64, 2, 128, 2, 3, 0]]
  - [-1, 1, MV2Block, [64, 2, 2]]  # 7-P4/16
  - [-1, 1, MobileViTBlockv2, [80, 4, 160, 2 ,3, 0]]
  - [-1, 1, MV2Block, [80, 2, 2]]  # 9-P5/16
  - [-1, 1, MobileViTBlockv2, [96, 3, 192, 1, 3, 0]]

head:
  # [from, repeats, module, args]
  # [from, repeats, MultiSEAM, [c2, depth, kernel_size, patch_size, reduction]]
#  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
#  - [[-1, 8], 1, Concat, [1]]  # cat backbone P4
#  - [-1, 2, C3k2, [384, False]]  # 13
#
#  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
#  - [[-1, 6], 1, Concat, [1]]  # cat backbone P3
#  - [-1, 2, C3k2, [256, False]]  # 16 (P3/8-small)
#
#  - [-1, 1, Conv, [256, 3, 2]]
#  - [[-1, 13], 1, Concat, [1]]  # cat head P4
#  - [-1, 2, C3k2, [384, False]]  # 19 (P4/16-medium)
#
#  - [-1, 1, Conv, [384, 3, 2]]
#  - [[-1, 10], 1, Concat, [1]]  # cat head P5
#  - [-1, 2, C3k2, [512, True]]  # 22 (P5/32-large)

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 8], 1, Concat, [1]]  # cat backbone P4
  - [-1, 2, C3k2, [48, False]]  # 13

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 6], 1, Concat, [1]]  # cat backbone P3
  - [-1, 2, C3k2, [24, False]]  # 16 (P3/8-small)

  - [-1, 1, Conv, [24, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]  # cat head P4
  - [-1, 2, C3k2, [48, False]]  # 19 (P4/16-medium)

  - [-1, 1, Conv, [48, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]  # cat head P5
  - [-1, 2, C3k2, [96, True]]  # 22 (P5/32-large)

#  - [ 16, 1, SEAM, [ 24, 1, 16 ] ]# 23
#  - [ 19, 1, SEAM, [ 48, 1, 16 ] ]# 24
#  - [ 22, 1, SEAM, [ 96, 1, 16 ] ]# 25

  - [ 16, 1, MultiSEAM, [ 24, 1, 3, [3, 5, 7], 8] ]# 23
  - [ 19, 1, MultiSEAM, [ 48, 1, 3, [3, 5, 7], 8] ]# 24
  - [ 22, 1, MultiSEAM, [ 96, 1, 3, [3, 5, 7], 8] ]# 25

#  - [[16, 19, 22], 1, Detect, [nc]]  # Detect(P3, P4, P5)
  - [[23, 24, 25], 1, Detect, [nc]]  # Detect(P3, P4, P5)